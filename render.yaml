# Optional "blueprint": Render can read this to create the service for you.
# (You can also create the service by hand in the dashboard - same settings.)
services:
  - type: web
    name: devguard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEVGUARD_PUBLIC
        value: "1"
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_FALLBACK_MODELS
        value: gemini-3-flash-preview,gemini-3.5-flash,gemini-2.5-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
